apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-kust
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-kust
  template:
    metadata:
      labels:
        app: hello-kust
    spec:
      containers:
      - name: hello-kust
        image: nginx:1.27
        envFrom:
        - configMapRef:
            name: hello-kust-config
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
